Qu\xE9 mensaje o conversaci\xF3n de los primeros d\xEDas todav\xEDa recuerdas casi palabra por palabra?",duration:null,special:!1,specialType:null},{id:"PI-07",deck:"conexion",category:"Primeras impresiones",level:null,actor:"AMBOS",title:"Pens\xE9 que eras / hoy s\xE9",instruction:"Completen por turnos: \u201CLa primera vez que te vi pens\xE9 que eras\u2026\u201D y despu\xE9s \u201CHoy s\xE9 que eres\u2026\u201D.",duration:null,special:!1,specialType:null},{id:"PI-08",deck:"conexion",category:"Primeras impresiones",level:null,actor:"T\xDA",title:"Descripci\xF3n sin filtro",instruction:"Describe a tu pareja como se la describiste a tu mejor amistad despu\xE9s de conocerla. Sin suavizar nada.",duration:null,special:!1,specialType:null},{id:"PI-09",deck:"conexion",category:"Primeras impresiones",level:null,actor:"AMBOS",title:"Ranking de nervios",instruction:"Ordenen del m\xE1s al menos nervioso: primera cita, primer beso, conocer a la familia, primera noche juntos. Comparen.",duration:null,special:!1,specialType:null},{id:"PI-10",deck:"conexion",category:"Primeras impresiones",level:null,actor:"ADIVINA",title:"El beso que no fue",instruction:"Adivina el momento en que tu pareja quiso besarte por primera vez y no se atrevi\xF3.",duration:null,special:!1,specialType:null},{id:"PI-11",deck:"conexion",category:"Primeras impresiones",level:null,actor:"TU PAREJA",title:"Lo que ya no hago",instruction:"\xBFQu\xE9 hac\xEDa yo al principio que te enganch\xF3 y que ya casi no hago? Hoy tienes permiso de pedirlo de vuelta.",duration:null,special:!1,specialType:null},{id:"PI-12",deck:"conexion",category:"Primeras impresiones",level:null,actor:"TU PAREJA",title:"Nada inocente",instruction:"\xBFCu\xE1ndo fue la primera vez que pensaste en m\xED de una forma nada inocente?",duration:null,special:!1,specialType:null},{id:"RE-01",deck:"conexion",category:"Recuerdos",level:null,actor:"AMBOS",title:"La peor cita",instruction:"Califiquen del 1 al 10 su peor cita juntos. Lo que importa es la historia, no el n\xFAmero.",duration:null,special:!1,specialType:null},{id:"RE-02",deck:"conexion",category:"Recuerdos",level:null,actor:"ADIVINA",title:"Foto favorita",instruction:"Adivina qu\xE9 foto de ustedes es la favorita de tu pareja. B\xFAsquenla si la tienen a mano.",duration:null,special:!1,specialType:null},{id:"RE-03",deck:"conexion",category:"Recuerdos",level:null,actor:"AMBOS",title:"El recuerdo olvidado",instruction:"Cada uno elige un recuerdo de los dos que el otro probablemente ya olvid\xF3. Cu\xE9ntenlo y vean si lo reconoce.",duration:null,special:!1,specialType:null},{id:"RE-04",deck:"conexion",category:"Recuerdos",level:null,actor:"AMBOS",title:"Verg\xFCenza a dos voces",instruction:"\xBFCu\xE1l ha sido su momento m\xE1s vergonzoso como pareja? Cu\xE9ntenlo a dos voces, una frase cada quien.",duration:null,special:!1,specialType:null},{id:"RE-05",deck:"conexion",category:"Recuerdos",level:null,actor:"TU PAREJA",title:"El detalle peque\xF1o",instruction:"\xBFQu\xE9 detalle peque\xF1o que hice hace tiempo sigues recordando?",duration:null,special:!1,specialType:null},{id:"RE-06",deck:"conexion",category:"Recuerdos",level:null,actor:"AMBOS",title:"Repetir un d\xEDa",instruction:"Si pudieran repetir un solo d\xEDa de su relaci\xF3n tal cual fue, \xBFcu\xE1l ser\xEDa? Elijan por separado y comparen.",duration:null,special:!1,specialType:null},{id:"RE-07",deck:"conexion",category:"Recuerdos",level:null,actor:"TU PAREJA",title:"La pelea que da risa",instruction:"\xBFQu\xE9 pelea nuestra hoy te da risa?",duration:null,special:!1,specialType:null},{id:"RE-08",deck:"conexion",category:"Recuerdos",level:null,actor:"AMBOS",title:"La foto que no existe",instruction:"\xBFQu\xE9 foto de nosotros deber\xEDa existir\u2026 pero nadie tom\xF3? Cuenten qu\xE9 estaba pasando.",duration:null,special:!1,specialType:null},{id:"RE-09",deck:"conexion",category:"Recuerdos",level:null,actor:"TU PAREJA",title:"El beso",instruction:"\xBFCu\xE1l es el beso nuestro que m\xE1s recuerdas? D\xF3nde, cu\xE1ndo y por qu\xE9 ese.",duration:null,special:!1,specialType:null},{id:"RE-10",deck:"conexion",category:"Recuerdos",level:null,actor:"T\xDA",title:"Iba en serio",instruction:"Completa: \u201CSupe que esto iba en serio el d\xEDa que\u2026\u201D",duration:null,special:!1,specialType:null},{id:"RE-11",deck:"conexion",category:"Recuerdos",level:null,actor:"TU PAREJA",title:"Lugar inesperado",instruction:"\xBFCu\xE1l es el lugar m\xE1s inesperado donde nos hemos besado\u2026 o algo m\xE1s?",duration:null,special:!1,specialType:null},{id:"RE-12",deck:"conexion",category:"Recuerdos",level:null,actor:"AMBOS",title:"Una noche, una palabra",instruction:"Cada uno piensa en la noche juntos que m\xE1s recuerda. Sin detalles: descr\xEDbanla con una sola palabra.",duration:null,special:!1,specialType:null},{id:"DE-01",deck:"conexion",category:"Desc\xFAbreme",level:null,actor:"TU PAREJA",title:"Relajarse en 5 minutos",instruction:"\xBFQu\xE9 te relaja en menos de cinco minutos y casi nadie sabe?",duration:null,special:!1,specialType:null},{id:"DE-02",deck:"conexion",category:"Desc\xFAbreme",level:null,actor:"T\xDA",title:"Cosquillas",instruction:"Del 1 al 10, \xBFqu\xE9 tantas cosquillas tienes? Tu pareja tiene 10 segundos para comprobarlo.",duration:null,special:!1,specialType:null},{id:"DE-03",deck:"conexion",category:"Desc\xFAbreme",level:null,actor:"TU PAREJA",title:"El cumplido pendiente",instruction:"\xBFQu\xE9 cumplido recibes poco y te encantar\xEDa escuchar m\xE1s?",duration:null,special:!1,specialType:null},{id:"DE-04",deck:"conexion",category:"Desc\xFAbreme",level:null,actor:"T\xDA",title:"Siempre quise",instruction:"Dile a tu pareja algo que siempre has querido aprender o probar, aunque suene raro.",duration:null,special:!1,specialType:null},{id:"DE-05",deck:"conexion",category:"Desc\xFAbreme",level:null,actor:"T\xDA",title:"Mi versi\xF3n contigo",instruction:"\xBFQu\xE9 versi\xF3n de ti aparece cuando est\xE1s conmigo y casi nadie m\xE1s conoce? Ponle un nombre.",duration:null,special:!1,specialType:null},{id:"DE-06",deck:"conexion",category:"Desc\xFAbreme",level:null,actor:"T\xDA",title:"Me siento atractivo/a",instruction:"Completa: \u201CMe siento m\xE1s atractivo/a cuando\u2026\u201D",duration:null,special:!1,specialType:null},{id:"DE-07",deck:"conexion",category:"Desc\xFAbreme",level:null,actor:"TU PAREJA",title:"Sorpresa o certeza",instruction:"\xBFPrefieres A) que te sorprendan o B) saber exactamente qu\xE9 viene? Responde para una cita\u2026 y para la cama.",duration:null,special:!1,specialType:null},{id:"DE-08",deck:"conexion",category:"Desc\xFAbreme",level:null,actor:"AMBOS",title:"Zona secreta",instruction:"Escriban en secreto una zona de su cuerpo donde les encanta que los toquen. Doblen el papel: se revela al final de la partida.",duration:null,special:!1,specialType:null},{id:"DE-09",deck:"conexion",category:"Desc\xFAbreme",level:null,actor:"ADIVINA",title:"Top 1 de caricias",instruction:"Tu pareja ordena en secreto: besos en el cuello, caricias en la espalda, que le hablen al o\xEDdo, que le tomen de la cintura. Adivina su n\xFAmero 1.",duration:null,special:!1,specialType:null},{id:"DE-10",deck:"conexion",category:"Desc\xFAbreme",level:null,actor:"TU PAREJA",title:"Personalidad \xEDntima",instruction:"Elige la palabra que m\xE1s te describe en la intimidad: paciente, juguet\xF3n/a, intenso/a, curioso/a o tierno/a. Explica en una frase.",duration:null,special:!1,specialType:null},{id:"DE-11",deck:"conexion",category:"Desc\xFAbreme",level:null,actor:"TU PAREJA",title:"\xBFLuz prendida o apagada?",instruction:"Sin pensar: \xBFluz prendida o apagada? \xBFMa\xF1ana o noche? \xBFDespacio o con prisa?",duration:null,special:!1,specialType:null},{id:"DE-12",deck:"conexion",category:"Desc\xFAbreme",level:null,actor:"T\xDA",title:"Lo que me enciende",instruction:"Escribe tres cosas no f\xEDsicas que te encienden (una voz, una actitud, un olor\u2026). Tu pareja intenta adivinar una antes de leerlas.",duration:null,special:!1,specialType:null},{id:"NO-01",deck:"conexion",category:"Nosotros",level:null,actor:"AMBOS",title:"Imitaci\xF3n con hambre",instruction:"Imita durante 20 segundos a tu pareja cuando tiene hambre. Despu\xE9s tu pareja te imita a ti.",duration:null,special:!1,specialType:null},{id:"NO-02",deck:"conexion",category:"Nosotros",level:null,actor:"T\xDA",title:"Nos parecemos",instruction:"Confiesa en qu\xE9 te has vuelto parecido/a a tu pareja sin darte cuenta.",duration:null,special:!1,specialType:null},{id:"NO-03",deck:"conexion",category:"Nosotros",level:null,actor:"T\xDA",title:"Broma interna",instruction:"Cuenta una broma interna de ustedes que ser\xEDa pr\xE1cticamente imposible explicarle a otra persona.",duration:null,special:!1,specialType:null},{id:"NO-04",deck:"conexion",category:"Nosotros",level:null,actor:"T\xDA",title:"Admiraci\xF3n callada",instruction:"Di algo que admiras de tu pareja y que nunca le has dicho en voz alta.",duration:null,special:!1,specialType:null},{id:"NO-05",deck:"conexion",category:"Nosotros",level:null,actor:"ADIVINA",title:"El gesto que me hace sentir querido/a",instruction:"Adivina qu\xE9 gesto tuyo hace que tu pareja se sienta m\xE1s querida.",duration:null,special:!1,specialType:null},{id:"NO-06",deck:"conexion",category:"Nosotros",level:null,actor:"TU PAREJA",title:"Costumbre intocable",instruction:"\xBFQu\xE9 costumbre nuestra nunca quisieras perder?",duration:null,special:!1,specialType:null},{id:"NO-07",deck:"conexion",category:"Nosotros",level:null,actor:"TU PAREJA",title:"Vistos desde fuera",instruction:"Describe c\xF3mo nos ver\xEDa alguien que nos observa en una cena sin conocernos.",duration:null,special:!1,specialType:null},{id:"NO-08",deck:"conexion",category:"Nosotros",level:null,actor:"ADIVINA",title:"Lo mejor de nosotros",instruction:"Predice qu\xE9 dir\xEDa tu pareja si le preguntaran: \u201C\xBFQu\xE9 es lo mejor de su relaci\xF3n?\u201D. Luego responde tu pareja.",duration:null,special:!1,specialType:null},{id:"NO-09",deck:"conexion",category:"Nosotros",level:null,actor:"AMBOS",title:"Irresistible",instruction:"Escriban qu\xE9 hace el otro que les parece irresistible aunque no se d\xE9 cuenta. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null},{id:"NO-10",deck:"conexion",category:"Nosotros",level:null,actor:"AMBOS",title:"La iniciativa",instruction:"\xBFQui\xE9n toma m\xE1s la iniciativa en la intimidad? \xBFLes gustar\xEDa invertirlo de vez en cuando?",duration:null,special:!1,specialType:null},{id:"NO-11",deck:"conexion",category:"Nosotros",level:null,actor:"TU PAREJA",title:"Deseado/a",instruction:"\xBFCu\xE1ndo te sientes m\xE1s deseado/a por m\xED?",duration:null,special:!1,specialType:null},{id:"NO-12",deck:"conexion",category:"Nosotros",level:null,actor:"TU PAREJA",title:"Lo que miras",instruction:"\xBFQu\xE9 parte de mi cuerpo miras cuando crees que no me doy cuenta?",duration:null,special:!1,specialType:null},{id:"LV-01",deck:"conexion",category:"Lo que viene",level:null,actor:"TU PAREJA",title:"Costumbre nueva",instruction:"\xBFQu\xE9 costumbre nueva te gustar\xEDa que empez\xE1ramos?",duration:null,special:!1,specialType:null},{id:"LV-02",deck:"conexion",category:"Lo que viene",level:null,actor:"AMBOS",title:"Tradici\xF3n propia",instruction:"Inventen una tradici\xF3n nueva solo de ustedes: cu\xE1ndo, d\xF3nde y qu\xE9 incluye.",duration:null,special:!1,specialType:null},{id:"LV-03",deck:"conexion",category:"Lo que viene",level:null,actor:"AMBOS",title:"La experiencia del a\xF1o",instruction:"Escriban en secreto una experiencia que quieren vivir juntos este a\xF1o. Revelen. Si coinciden, ya tienen plan.",duration:null,special:!1,specialType:null},{id:"LV-04",deck:"conexion",category:"Lo que viene",level:null,actor:"AMBOS",title:"Un martes en 5 a\xF1os",instruction:"Imaginen un martes cualquiera dentro de cinco a\xF1os. \xBFQu\xE9 peque\xF1a costumbre esperan seguir haciendo juntos?",duration:null,special:!1,specialType:null},{id:"LV-05",deck:"conexion",category:"Lo que viene",level:null,actor:"AMBOS",title:"Palabra clave",instruction:"Inventen una palabra clave que, a partir de hoy, signifique: \u201Cnecesito un rato solo contigo\u201D.",duration:null,special:!1,specialType:null},{id:"LV-06",deck:"conexion",category:"Lo que viene",level:null,actor:"AMBOS",title:"Primera vez pendiente",instruction:"Cada uno dice una \u201Cprimera vez\u201D que todav\xEDa quiere vivir con el otro. No vale viaje, comida ni sexo.",duration:null,special:!1,specialType:null},{id:"LV-07",deck:"conexion",category:"Lo que viene",level:null,actor:"T\xDA",title:"Curiosidad",instruction:"Completa: \u201CAlgo que nunca hemos hecho juntos y me da curiosidad es\u2026\u201D",duration:null,special:!1,specialType:null},{id:"LV-08",deck:"conexion",category:"Lo que viene",level:null,actor:"TU PAREJA",title:"Atr\xE9vete conmigo",instruction:"\xBFQu\xE9 te gustar\xEDa que me atreviera a hacer contigo?",duration:null,special:!1,specialType:null},{id:"LV-09",deck:"conexion",category:"Lo que viene",level:null,actor:"AMBOS",title:"Un lugar de la casa",instruction:"Cada uno nombra un lugar privado de la casa donde nunca han tenido intimidad. \xBFCoinciden?",duration:null,special:!1,specialType:null},{id:"LV-10",deck:"conexion",category:"Lo que viene",level:null,actor:"AMBOS",title:"El papel doblado",instruction:"Escriban algo que les gustar\xEDa probar en la intimidad alg\xFAn d\xEDa. Doblen el papel: solo se abre si ambos aceptan leerlo.",duration:null,special:!1,specialType:null},{id:"LV-11",deck:"conexion",category:"Lo que viene",level:null,actor:"TU PAREJA",title:"La habitaci\xF3n de esta noche",instruction:"Si esta noche pudi\xE9ramos terminar en cualquier habitaci\xF3n de la casa, \xBFcu\xE1l eliges? No digas por qu\xE9 todav\xEDa.",duration:null,special:!1,specialType:null},{id:"LV-12",deck:"conexion",category:"Lo que viene",level:null,actor:"T\xDA",title:"Una palabra",instruction:"Di una sola palabra para lo que quieres que pase despu\xE9s de esta carta.",duration:null,special:!1,specialType:null},{id:"CE-ESP-01",deck:"conexion",category:null,level:null,actor:"AMBOS",title:"AMBOS",instruction:"La siguiente pregunta la responden los dos.",duration:null,special:!0,specialType:"ambos"},{id:"CE-ESP-02",deck:"conexion",category:null,level:null,actor:"ADIVINA",title:"ADIVINA",instruction:"Antes de que tu pareja responda la siguiente carta, intenta adivinar su respuesta. Despu\xE9s tu pareja revela la respuesta real.",duration:null,special:!0,specialType:"adivina"},{id:"CE-ESP-03",deck:"conexion",category:null,level:null,actor:"AMBOS",title:"PROFUNDIZA",instruction:"Elige una respuesta anterior que te haya dado curiosidad y haz una pregunta adicional sobre ella.",duration:null,special:!0,specialType:"profundiza"},{id:"CE-ESP-04",deck:"conexion",category:null,level:null,actor:"T\xDA",title:"SIN PENSAR",instruction:"La pr\xF3xima pregunta debe comenzar a responderse en menos de 5 segundos. PASO sigue permitido.",duration:"5 s para empezar",special:!0,specialType:"sinPensar"},{id:"CE-ESP-05",deck:"conexion",category:null,level:null,actor:"T\xDA",title:"DOS CAMINOS",instruction:"Toma dos cartas normales. Tu pareja elige cu\xE1l respondes. La otra vuelve al fondo del mazo.",duration:null,special:!0,specialType:"dosCaminos"},{id:"CE-ESP-06",deck:"conexion",category:null,level:null,actor:"T\xDA",title:"EN TUS ZAPATOS",instruction:"Responde la siguiente pregunta como crees que responder\xEDa tu pareja. Despu\xE9s, tu pareja revela su respuesta real.",duration:null,special:!0,specialType:"enTusZapatos"},{id:"CE-ESP-07",deck:"conexion",category:null,level:null,actor:"TU PAREJA",title:"CU\xC9NTAME M\xC1S",instruction:"Tu pareja elige una respuesta anterior sobre la que quiere escuchar m\xE1s. Cu\xE9ntale un poco m\xE1s.",duration:null,special:!0,specialType:"cuentameMas"},{id:"CE-ESP-08",deck:"conexion",category:null,level:null,actor:"AMBOS",title:"OTRA VEZ",instruction:"Elijan su pregunta favorita de las ya jugadas y resp\xF3ndanla nuevamente, ahora los dos.",duration:null,special:!0,specialType:"otraVez"},{id:"CE-ESP-09",deck:"conexion",category:null,level:null,actor:"T\xDA",title:"GU\xC1RDALA",instruction:"Conserva esta carta. En cualquier momento de la noche puedes recuperar una pregunta ya utilizada. Una vez usada, desc\xE1rtala.",duration:"Hasta usarla",special:!0,specialType:"guardala"},{id:"A1-01",deck:"accion",category:null,level:1,actor:"AMBOS",title:"Quien se r\xEDa primero",instruction:"Si\xE9ntense frente a frente con las rodillas toc\xE1ndose. M\xEDrense sin hablar. Quien se r\xEDa primero da un beso donde el otro elija.",duration:"60 s",special:!1,specialType:null},{id:"A1-02",deck:"accion",category:null,level:1,actor:"AMBOS",title:"Abrazo sincronizado",instruction:"Abrazo largo de pie. No se suelten hasta que sientan que sus respiraciones se sincronizaron.",duration:"~1 min",special:!1,specialType:null},{id:"A1-03",deck:"accion",category:null,level:1,actor:"T\xDA",title:"Cata a ciegas",instruction:"Vayan a la cocina. Dale a probar a tu pareja algo con los ojos cerrados; tiene que adivinar qu\xE9 es.",duration:null,special:!1,specialType:null},{id:"A1-04",deck:"accion",category:null,level:1,actor:"T\xDA",title:"\xBFQu\xE9 cambi\xF3?",instruction:"Cierra los ojos. Tu pareja cambia un detalle de su aspecto (cabello, bot\xF3n, accesorio). \xC1brelos y adivina qu\xE9 cambi\xF3; si aciertas, ganas un beso.",duration:null,special:!1,specialType:null},{id:"A1-05",deck:"accion",category:null,level:1,actor:"T\xDA",title:"Escritura en la piel",instruction:"Con un dedo, escribe una palabra en la espalda de tu pareja. Tiene tres intentos para adivinar; si acierta, cambian de lugar.",duration:null,special:!1,specialType:null},{id:"A1-06",deck:"accion",category:null,level:1,actor:"AMBOS",title:"Sin manos",instruction:"Sostengan juntos un trozo de fruta o chocolate entre los labios, sin manos. Quien lo suelte ofrece el siguiente.",duration:null,special:!1,specialType:null},{id:"A1-07",deck:"accion",category:null,level:1,actor:"T\xDA",title:"Susurro",instruction:"Ac\xE9rcate al o\xEDdo de tu pareja y dile algo que te gusta de ella. Solo en susurro.",duration:"15 s",special:!1,specialType:null},{id:"A1-08",deck:"accion",category:null,level:1,actor:"TU PAREJA",title:"Tres besos guiados",instruction:"Tu pareja se\xF1ala tres puntos de su cara. B\xE9salos en el orden que te indique.",duration:null,special:!1,specialType:null},{id:"A1-09",deck:"accion",category:null,level:1,actor:"T\xDA",title:"Latido",instruction:"Pon el o\xEDdo en el pecho de tu pareja y escucha su coraz\xF3n. Dile a qu\xE9 ritmo crees que va.",duration:"30 s",special:!1,specialType:null},{id:"A1-10",deck:"accion",category:null,level:1,actor:"T\xDA",title:"Hazme re\xEDr",instruction:"Tienes 30 segundos para hacer re\xEDr a tu pareja sin tocarla. Si no lo logras, te ganas un beso donde ella diga.",duration:"30 s",special:!1,specialType:null},{id:"A1-11",deck:"accion",category:null,level:1,actor:"T\xDA",title:"Contra la pared",instruction:"Lleva a tu pareja de la mano al pasillo, rec\xE1rgala suavemente en la pared y m\xEDrala 10 segundos antes de besarla.",duration:"10 s + beso",special:!1,specialType:null},{id:"A1-12",deck:"accion",category:null,level:1,actor:"T\xDA",title:"Aire tibio",instruction:"Respira despacio sobre el cuello de tu pareja, sin besarlo. Solo aire tibio.",duration:"20 s",special:!1,specialType:null},{id:"A2-01",deck:"accion",category:null,level:2,actor:"TU PAREJA",title:"Mensaje dictado",instruction:"Tu pareja te dicta, palabra por palabra, un mensaje coqueto que le env\xEDas a su celular ahora mismo. Lo lee en voz alta.",duration:null,special:!1,specialType:null},{id:"A2-02",deck:"accion",category:null,level:2,actor:"TU PAREJA",title:"Beso con instrucciones",instruction:"Besa a tu pareja siguiendo solo sus palabras: \u201Cm\xE1s lento\u201D, \u201Cm\xE1s suave\u201D, \u201Cah\xED\u201D.",duration:"60 s",special:!1,specialType:null},{id:"A2-03",deck:"accion",category:null,level:2,actor:"T\xDA",title:"Sin tus manos",instruction:"Si\xE9ntate de frente en las piernas de tu pareja. Ella no puede usar las manos.",duration:"45 s",special:!1,specialType:null},{id:"A2-04",deck:"accion",category:null,level:2,actor:"AMBOS",title:"Iniciativa invertida",instruction:"Quien casi nunca toma la iniciativa tiene 60 segundos para provocar al otro sin quitarle ropa.",duration:"60 s",special:!1,specialType:null},{id:"A2-05",deck:"accion",category:null,level:2,actor:"AMBOS",title:"La barra de la cocina",instruction:"En la cocina: uno se sienta en la mesa o barra firme, el otro de pie entre sus rodillas. Besos, sin pasar de ah\xED.",duration:"1 min",special:!1,specialType:null},{id:"A2-06",deck:"accion",category:null,level:2,actor:"T\xDA",title:"Una prenda menos",instruction:"Ve a otra habitaci\xF3n y regresa con una prenda menos. Tu pareja adivina cu\xE1l falta sin tocarte.",duration:null,special:!1,specialType:null},{id:"A2-07",deck:"accion",category:null,level:2,actor:"T\xDA",title:"Mordidas",instruction:"Una mordida suave en el l\xF3bulo, otra en el hombro y otra en el labio. Tu pareja dice cu\xE1l le gust\xF3 m\xE1s.",duration:null,special:!1,specialType:null},{id:"A2-08",deck:"accion",category:null,level:2,actor:"T\xDA",title:"Solo el t\xEDtulo",instruction:"Dile al o\xEDdo a tu pareja qu\xE9 le har\xEDas si el juego terminara ya. Solo el t\xEDtulo, sin detalles.",duration:null,special:!1,specialType:null},{id:"A2-09",deck:"accion",category:null,level:2,actor:"AMBOS",title:"A un cent\xEDmetro",instruction:"Ac\xE9rquense hasta casi besarse y det\xE9nganse a un cent\xEDmetro. Aguanten 10 segundos. Quien resista m\xE1s elige la siguiente acci\xF3n.",duration:"10 s",special:!1,specialType:null},{id:"A2-10",deck:"accion",category:null,level:2,actor:"T\xDA",title:"Labios dulces",instruction:"Ponte un poco de miel, chocolate o crema batida en los labios. Tu pareja decide c\xF3mo quitarlo.",duration:null,special:!1,specialType:null},{id:"A2-11",deck:"accion",category:null,level:2,actor:"AMBOS",title:"Espejo",instruction:"Frente a un espejo, uno detr\xE1s del otro: quien est\xE1 atr\xE1s besa el cuello mientras ambos miran el reflejo.",duration:"45 s",special:!1,specialType:null},{id:"A2-12",deck:"accion",category:null,level:2,actor:"AMBOS",title:"Elecci\xF3n secreta",instruction:"Cada uno elige en secreto: 1 = beso, 2 = caricia bajo la ropa, 3 = quitar una prenda. Revelen y hagan las dos.",duration:null,special:!1,specialType:null},{id:"A3-01",deck:"accion",category:null,level:3,actor:"T\xDA",title:"Desnudo lento",instruction:"Desviste a tu pareja por completo, una prenda a la vez, besando cada zona que vas descubriendo.",duration:null,special:!1,specialType:null},{id:"A3-02",deck:"accion",category:null,level:3,actor:"TU PAREJA",title:"Mapa er\xF3geno",instruction:"Tu pareja toma tu mano y te muestra tres zonas donde le gusta que la toquen. Expl\xF3ralas en ese orden.",duration:"2 min",special:!1,specialType:null},{id:"A3-03",deck:"accion",category:null,level:3,actor:"T\xDA",title:"Del 1 al 5",instruction:"Acaricia cinco zonas distintas de tu pareja. Despu\xE9s de cada una, ella da un n\xFAmero del 1 al 5. Repite la mejor calificada.",duration:"2 min",special:!1,specialType:null},{id:"A3-04",deck:"accion",category:null,level:3,actor:"AMBOS",title:"Regadera",instruction:"Vayan a la regadera y enjab\xF3nense uno al otro de pies a cabeza, sin saltarse ninguna zona.",duration:"5 min",special:!1,specialType:null},{id:"A3-05",deck:"accion",category:null,level:3,actor:"T\xDA",title:"El gemido exagerado",instruction:"Imita el gemido m\xE1s exagerado que puedas de tu pareja. Despu\xE9s, tu pareja te demuestra c\xF3mo suena de verdad.",duration:null,special:!1,specialType:null},{id:"A3-06",deck:"accion",category:null,level:3,actor:"T\xDA",title:"Oral guiado",instruction:"Sexo oral para tu pareja. Ella marca el ritmo con su mano o con palabras.",duration:"60 s",special:!1,specialType:null},{id:"A3-07",deck:"accion",category:null,level:3,actor:"T\xDA",title:"M\xEDrame",instruction:"T\xF3cate frente a tu pareja mostr\xE1ndole c\xF3mo te gusta. Tu pareja solo mira.",duration:"60 s",special:!1,specialType:null},{id:"A3-08",deck:"accion",category:null,level:3,actor:"AMBOS",title:"C\xE1mara lenta",instruction:"Caricias \xEDntimas mutuas con una regla: lo m\xE1s lento posible. Quien acelere vuelve a empezar.",duration:"2 min",special:!1,specialType:null},{id:"A3-09",deck:"accion",category:null,level:3,actor:"T\xDA",title:"Casi",instruction:"Besa el interior de los muslos de tu pareja desde la rodilla hacia arriba y detente justo antes de llegar. Tres veces.",duration:null,special:!1,specialType:null},{id:"A3-10",deck:"accion",category:null,level:3,actor:"AMBOS",title:"69",instruction:"El n\xFAmero del juego no es casualidad: 69 durante un minuto. Si la posici\xF3n no les acomoda, t\xFArnense.",duration:"60 s",special:!1,specialType:null},{id:"A3-11",deck:"accion",category:null,level:3,actor:"AMBOS",title:"La mesa del comedor",instruction:"Tu pareja se recuesta sobre la mesa del comedor (firme y despejada). T\xFA besas desde los pies hacia arriba.",duration:"2 min",special:!1,specialType:null},{id:"A3-12",deck:"accion",category:null,level:3,actor:"TU PAREJA",title:"Narra lo que sientes",instruction:"Mientras acaricias \xEDntimamente a tu pareja, tu pareja narra en voz baja lo que siente. Si se calla, te detienes.",duration:"90 s",special:!1,specialType:null},{id:"A4-01",deck:"accion",category:null,level:4,actor:"TU PAREJA",title:"Ojos cubiertos",instruction:"Con su permiso, cubre los ojos de tu pareja con un pa\xF1uelo o antifaz. No sabr\xE1 d\xF3nde ni con qu\xE9 la tocas: manos, labios, cabello, una pluma.",duration:"3 min",special:!1,specialType:null},{id:"A4-02",deck:"accion",category:null,level:4,actor:"T\xDA",title:"Fr\xEDo y tibio",instruction:"Con un hielo en la boca, recorre pecho, abdomen y muslos; alterna con tu boca tibia. No dejes el hielo quiet "Espera",level:1,actor:"TU PAREJA",title:"Prohibido tocar",instruction:"Tu pareja se acerca a ti todo lo que quiera, pero ninguno de los dos puede tocar al otro.",duration:"60 s",special:!1,specialType:null},{id:"ES-02",deck:"provocacion",category:"Espera",level:1,actor:"T\xDA",title:"Todo menos la boca",instruction:"Besa el rostro de tu pareja completo (frente, p\xE1rpados, mejillas, ment\xF3n) menos la boca.",duration:"30 s",special:!1,specialType:null},{id:"ES-03",deck:"provocacion",category:"Espera",level:2,actor:"T\xDA",title:"Un bot\xF3n por turno",instruction:"Desde ahora, en cada turno tuyo desabrocha un solo bot\xF3n o baja un poco un cierre de tu pareja. Nada m\xE1s.",duration:"Resto del juego",special:!1,specialType:null},{id:"ES-04",deck:"provocacion",category:"Espera",level:1,actor:"TU PAREJA",title:"Estatua",instruction:"Qu\xE9date inm\xF3vil. Tu pareja camina a tu alrededor muy despacio, sin tocarte, dici\xE9ndote qu\xE9 est\xE1 mirando.",duration:"45 s",special:!1,specialType:null},{id:"ES-05",deck:"provocacion",category:"Espera",level:2,actor:"AMBOS",title:"Cama prohibida",instruction:"Durante las siguientes tres cartas la cama est\xE1 prohibida: sill\xF3n, alfombra o de pie.",duration:null,special:!1,specialType:null},{id:"ES-06",deck:"provocacion",category:"Espera",level:2,actor:"T\xDA",title:"Una sola prenda",instruction:"Pon una canci\xF3n y qu\xEDtate una sola prenda, lo m\xE1s lento posible, mirando a tu pareja. Ella no ayuda.",duration:null,special:!1,specialType:null},{id:"ES-07",deck:"provocacion",category:"Espera",level:2,actor:"TU PAREJA",title:"El borde de la tela",instruction:"Tu pareja recorre con un dedo el contorno de tu ropa interior, por encima de la tela. Sin meter la mano.",duration:"30 s",special:!1,specialType:null},{id:"ES-08",deck:"provocacion",category:"Espera",level:1,actor:"AMBOS",title:"Term\xF3metro",instruction:"Digan del 1 al 10 cu\xE1ntas ganas tienen ahora. Repitan la pregunta al terminar la siguiente carta.",duration:null,special:!1,specialType:null},{id:"RO-01",deck:"provocacion",category:"Roce",level:1,actor:"T\xDA",title:"Solo la nariz",instruction:"Recorre el brazo de tu pareja con la punta de la nariz, de la mu\xF1eca al hombro, y regresa.",duration:null,special:!1,specialType:null},{id:"RO-02",deck:"provocacion",category:"Roce",level:1,actor:"TU PAREJA",title:"Besos de mariposa",instruction:"Tu pareja roza tus labios, mejillas y cuello solo con sus pesta\xF1as.",duration:"30 s",special:!1,specialType:null},{id:"RO-03",deck:"provocacion",category:"Roce",level:1,actor:"AMBOS",title:"Canci\xF3n lenta",instruction:"Pongan una canci\xF3n lenta y bailen pegados, sin besarse, hasta que termine.",duration:"1 canci\xF3n",special:!1,specialType:null},{id:"RO-04",deck:"provocacion",category:"Roce",level:1,actor:"T\xDA",title:"Mano en el muslo",instruction:"Tu pareja te cuenta su d\xEDa. T\xFA pon la mano en su muslo y s\xFAbela un poco cada 10 segundos.",duration:"1 min",special:!1,specialType:null},{id:"RO-05",deck:"provocacion",category:"Roce",level:1,actor:"TU PAREJA",title:"Desde la nuca",instruction:"Tu pareja mete los dedos en tu cabello desde la nuca y tira suavemente desde la ra\xEDz.",duration:"45 s",special:!1,specialType:null},{id:"RO-06",deck:"provocacion",category:"Roce",level:1,actor:"T\xDA",title:"L\xEDneas de la mano",instruction:"Con las yemas, sigue las l\xEDneas de las palmas y los dedos de tu pareja como si nunca la hubieras tocado.",duration:"45 s",special:!1,specialType:null},{id:"RO-07",deck:"provocacion",category:"Roce",level:1,actor:"AMBOS",title:"Piernas enredadas",instruction:"Recu\xE9stense vestidos, enreden las piernas y mu\xE9vanlas despacio una contra otra. Sin manos.",duration:"60 s",special:!1,specialType:null},{id:"RO-08",deck:"provocacion",category:"Roce",level:2,actor:"TU PAREJA",title:"Labio inferior",instruction:"Tu pareja toma tu labio inferior entre los suyos sin besarte del todo. Lo suelta y vuelve, tres veces.",duration:null,special:!1,specialType:null},{id:"RT-01",deck:"provocacion",category:"Reto",level:1,actor:"TU PAREJA",title:"El primer suspiro",instruction:"Tu pareja tiene 30 segundos para sacarte un suspiro sin tocar zonas \xEDntimas. Si lo logra, elige la siguiente carta.",duration:"30 s",special:!1,specialType:null},{id:"RT-02",deck:"provocacion",category:"Reto",level:2,actor:"AMBOS",title:"Piedra, papel o tijera",instruction:"Jueguen al mejor de tres. Quien pierde se quita la prenda que elija quien gana.",duration:null,special:!1,specialType:null},{id:"RT-03",deck:"provocacion",category:"Reto",level:2,actor:"TU PAREJA",title:"Pose de portada",instruction:"Tu pareja te pide una pose sugerente. Sostenla mientras te observa. Sin fotos: solo para sus ojos.",duration:"15 s",special:!1,specialType:null},{id:"RT-04",deck:"provocacion",category:"Reto",level:2,actor:"T\xDA",title:"Mu\xF1ecas arriba",instruction:"Con suavidad, sost\xE9n las mu\xF1ecas de tu pareja por encima de su cabeza mientras la besas.",duration:"30 s",special:!1,specialType:null},{id:"RT-05",deck:"provocacion",category:"Reto",level:1,actor:"AMBOS",title:"El dado",instruction:"Tiren un dado: 1-2 cuello, 3-4 espalda, 5-6 abdomen. Quien tir\xF3 recibe besos ah\xED.",duration:"20 s",special:!1,specialType:null},{id:"RT-06",deck:"provocacion",category:"Reto",level:1,actor:"T\xDA",title:"Ven aqu\xED",instruction:"Tu pareja se va al otro lado del cuarto. Conv\xE9ncela de volver solo con gestos, sin palabras y sin moverte.",duration:null,special:!1,specialType:null},{id:"RT-07",deck:"provocacion",category:"Reto",level:2,actor:"T\xDA",title:"Pide antes",instruction:"Antes de cada caricia, describe exactamente qu\xE9 vas a hacer. Solo act\xFAas si tu pareja dice \u201Cs\xED\u201D.",duration:"60 s",special:!1,specialType:null},{id:"RT-08",deck:"provocacion",category:"Reto",level:2,actor:"AMBOS",title:"Calificaci\xF3n interior",instruction:"Cada uno muestra la ropa interior que trae puesta. El otro la califica del 1 al 10, con argumentos.",duration:null,special:!1,specialType:null},{id:"PV-ESP-01",deck:"provocacion",category:null,level:null,actor:"AMBOS",title:"PR\xD3RROGA",instruction:"La siguiente carta dura el doble. Si no tiene tiempo marcado, se repite una vez m\xE1s.",duration:null,special:!0,specialType:"nota"},{id:"PV-ESP-02",deck:"provocacion",category:null,level:null,actor:"AMBOS",title:"PROHIBIDO BESAR",instruction:"Hasta la siguiente carta especial, nada de besos en la boca. En ning\xFAn otro lado hay restricci\xF3n.",duration:null,special:!0,specialType:"nota"},{id:"PV-ESP-03",deck:"provocacion",category:null,level:null,actor:"T\xDA",title:"\xA1ALTO!",instruction:"Durante la siguiente carta puedes decir \u201C\xA1alto!\u201D una vez: ambos se congelan 10 segundos y luego siguen.",duration:null,special:!0,specialType:"nota"},{id:"PV-ESP-04",deck:"provocacion",category:null,level:null,actor:"TU PAREJA",title:"AL REV\xC9S",instruction:"La siguiente carta se invierte: la realiza quien la iba a recibir.",duration:null,special:!0,specialType:"nota"},{id:"EN-01",deck:"decision",category:"Esta noche",level:null,actor:"AMBOS",title:"Ritmo de la noche",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Lento y largo",b:"R\xE1pido e intenso",match:"Esa es la regla del resto de la partida.",noMatch:"Alternen: una carta de cada."}},{id:"EN-02",deck:"decision",category:"Esta noche",level:1,actor:"ADIVINA",title:"\xBFQui\xE9n empieza?",instruction:"Tu pareja elige en secreto. T\xFA intentas adivinar qu\xE9 eligi\xF3.",duration:null,special:!1,specialType:null,choice:{a:"Besar",b:"Que me besen",match:"Si aciertas, t\xFA decides d\xF3nde es el primer beso.",noMatch:"Si fallas, lo decide tu pareja."}},{id:"EN-03",deck:"decision",category:"Esta noche",level:null,actor:"AMBOS",title:"Fondo",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Con m\xFAsica",b:"En silencio",matc o elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Probar uno",b:"Solo nuestros cuerpos",match:"A: elijan juntos cu\xE1l comprar. B: brinden por ustedes.",noMatch:"Hablen 1 minuto de qu\xE9 los hace dudar."}},{id:"GU-08",deck:"decision",category:"Gustos",level:3,actor:"AMBOS",title:"Volumen",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Contenerse",b:"Sin contenerse",match:"Esa es la regla esta noche.",noMatch:"Cada quien suena como quiera."}},{id:"EC-01",deck:"decision",category:"Escenarios",level:null,actor:"AMBOS",title:"Escapada",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Hotel en la ciudad",b:"Caba\xF1a lejos de todo",match:"Pongan fecha antes de seguir.",noMatch:"Cada uno vende la suya en 20 segundos."}},{id:"EC-02",deck:"decision",category:"Escenarios",level:2,actor:"AMBOS",title:"Personajes",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Desconocidos en un bar",b:"Jefe/a y nuevo/a empleado/a",match:"La siguiente carta se juega en ese papel.",noMatch:"Quedan apuntados para otra noche."}},{id:"EC-03",deck:"decision",category:"Escenarios",level:2,actor:"ADIVINA",title:"Fuera de la rec\xE1mara",instruction:"Tu pareja elige en secreto. T\xFA intentas adivinar qu\xE9 eligi\xF3.",duration:null,special:!1,specialType:null,choice:{a:"Una silla firme",b:"El sill\xF3n de la sala",match:"Si aciertas, all\xE1 se va la siguiente carta.",noMatch:"Si fallas, se quedan donde est\xE1n."}},{id:"EC-04",deck:"decision",category:"Escenarios",level:null,actor:"AMBOS",title:"A qu\xE9 hora",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Al despertar",b:"A media tarde",match:"Ag\xE9ndenlo esta semana.",noMatch:"Prueben las dos, una cada semana."}},{id:"EC-05",deck:"decision",category:"Escenarios",level:null,actor:"AMBOS",title:"Vestuario",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Lencer\xEDa nueva",b:"Solo una camisa tuya",match:"Esa es la pr\xF3xima sorpresa.",noMatch:"Cada quien sorprende al otro con la suya."}},{id:"EC-06",deck:"decision",category:"Escenarios",level:null,actor:"AMBOS",title:"Al aire libre",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Auto estacionado en lugar privado",b:"Terraza o patio sin vecinos a la vista",match:"Queda pendiente para otro d\xEDa.",noMatch:"Gana la que tenga menos riesgo."}},{id:"EC-07",deck:"decision",category:"Escenarios",level:3,actor:"ADIVINA",title:"Su pel\xEDcula",instruction:"Tu pareja elige en secreto. T\xFA intentas adivinar qu\xE9 eligi\xF3.",duration:null,special:!1,specialType:null,choice:{a:"Romance lento",b:"Pasi\xF3n urgente contra la puerta",match:"Si aciertas, la siguiente carta va con ese guion.",noMatch:"Si fallas, tu pareja dirige la escena."}},{id:"EC-08",deck:"decision",category:"Escenarios",level:null,actor:"AMBOS",title:"La pr\xF3xima noche",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Yo la organizo",b:"T\xFA la organizas",match:"Qued\xF3 decidido.",noMatch:"La organizan juntos."}},{id:"AL-01",deck:"decision",category:"Al l\xEDmite",level:4,actor:"AMBOS",title:"Quieto/a",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Manos atadas con un pa\xF1uelo",b:"Prohibido moverse sin permiso",match:"T\xFArnense: 2 minutos cada uno.",noMatch:"Cada quien recibe su elecci\xF3n."}},{id:"AL-02",deck:"decision",category:"Al l\xEDmite",level:4,actor:"AMBOS",title:"El final",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Terminar juntos",b:"Uno primero y luego el otro",match:"Esa es la meta de esta noche.",noMatch:"Gana quien tenga m\xE1s ganas de esperar."}},{id:"AL-03",deck:"decision",category:"Al l\xEDmite",level:3,actor:"ADIVINA",title:"Lo m\xE1s atrevido",instruction:"Tu pareja elige en secreto. T\xFA intentas adivinar qu\xE9 eligi\xF3.",duration:null,special:!1,specialType:null,choice:{a:"Un lugar nuevo",b:"Algo nuevo en la cama",match:"Si aciertas, tu pareja dice qu\xE9 ser\xEDa.",noMatch:"Si fallas, t\xFA lo propones."}},{id:"AL-04",deck:"decision",category:"Al l\xEDmite",level:3,actor:"AMBOS",title:"Posici\xF3n",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"De frente",b:"Por detr\xE1s",match:"Empiecen as\xED.",noMatch:"Una ronda de cada una."}},{id:"AL-05",deck:"decision",category:"Al l\xEDmite",level:3,actor:"AMBOS",title:"Dar o recibir",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Dar oral",b:"Recibir oral",match:"T\xFArnense: 1 minuto cada uno.",noMatch:"Perfecto: cada quien tiene lo que quiere."}},{id:"AL-06",deck:"decision",category:"Al l\xEDmite",level:4,actor:"AMBOS",title:"Intensidad",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Suave",b:"Rudo, dentro de lo acordado",match:"As\xED es el resto de la noche.",noMatch:"Empiecen suave y suban si ambos quieren."}},{id:"AL-07",deck:"decision",category:"Al l\xEDmite",level:3,actor:"ADIVINA",title:"Su punto d\xE9bil",instruction:"Tu pareja elige en secreto. T\xFA intentas adivinar qu\xE9 eligi\xF3.",duration:null,special:!1,specialType:null,choice:{a:"Cuello y orejas",b:"Pechos y pezones",match:"Si aciertas, 1 minuto para ti ah\xED.",noMatch:"Si fallas, tu pareja te ense\xF1a c\xF3mo."}},{id:"AL-08",deck:"decision",category:"Al l\xEDmite",level:3,actor:"AMBOS",title:"Cu\xE1nto tiempo",instruction:"Cada uno elige en secreto. Revelen al mismo tiempo.",duration:null,special:!1,specialType:null,choice:{a:"Rapidito ahora",b:"Largo y sin prisa",match:"Ya saben qu\xE9 sigue.",noMatch:"Uno r\xE1pido ahora y otro largo despu\xE9s."}},{id:"DC-ESP-01",deck:"decision",category:null,level:null,actor:"AMBOS",title:"OPCI\xD3N C",instruction:"En la siguiente carta pueden proponer una tercera opci\xF3n. Solo vale si ambos la eligen.",duration:null,special:!0,specialType:"nota"},{id:"DC-ESP-02",deck:"decision",category:null,level:null,actor:"AMBOS",title:"ELIGE POR M\xCD",instruction:"En la siguiente carta cada uno elige lo que cree que prefiere el otro, no lo propio.",duration:null,special:!0,specialType:"nota"},{id:"DC-ESP-03",deck:"decision",category:null,level:null,actor:"AMBOS",title:"DOBLE O NADA",instruction:"Si en la siguiente carta coinciden, hacen las dos opciones. Si no, ninguna.",duration:null,special:!0,specialType:"nota"},{id:"DC-ESP-04",deck:"decision",category:null,level:null,actor:"T\xDA",title:"ME ARREPIENTO",instruction:"Despu\xE9s de revelar la siguiente carta, puedes cambiar tu elecci\xF3n una sola vez.",duration:null,special:!0,specialType:"nota"},{id:"LM-BS-01",deck:"limite",category:"Boca sucia",level:4,actor:"T\xDA",title:"Boca sucia",instruction:"Dile al o\xEDdo, sin filtro y con tus propias palabras, exactamente lo que le vas a hacer esta noche. Si se r\xEDe o se sonroja, empiezas de nuevo.",duration:null,special:!1,specialType:null},{id:"LM-BS-02",deck:"limite",category:"Boca sucia",level:4,actor:"AMBOS",title:"Palabra prohibida",instruction:"Cada quien escribe en secreto la palabra m\xE1s sucia que le gustar\xEDa escuchar en la cama. Intercambien papeles: desde ahora, esa palabra es obligatoria.",duration:"Resto del juego",special:!1,specialType:null},{id:"LM-BS-03",deck:"limite",category:"Boca sucia",level:4,actor:"T\xDA",title:"Narrador",instruction:"Tu pareja te besa donde quiera. T\xFA narras en voz baja lo que te hace y lo que sientes. Si te quedas callado/a, se detiene.",duration:"2 min",special:!1,specialType:null},{id:"LM-BS-04",deck:"limite",category:"Boca sucia",level:4,actor:"T\xDA",title:"Ru\xE9game",instruction:"P\xEDdele a tu pareja lo que quieres que te haga\u2026 rogando. No se concede hasta que suene lo bastante desesperado.",duration:null,special:!1,specialType:null},{id:"LM-BS-05",deck:"limite",category:"Boca sucia",level:4,actor:"TU PAREJA",title:"Lo que pens\xE9 hoy",instruction:"Confiesa el pensamiento m\xE1s sucio que tuviste hoy sobre m\xED, con todos los detalles que te atrevas a decir.",duration:null,special:!1,specialType:null},{id:"LM-BS-06",deck:"limite",category:"Boca sucia",level:4,actor:"T\xDA",title:"Sin eufemismos",instruction:"Nombra en voz alta, con la palabra m\xE1s directa que conozcas, la parte del cuerpo de tu pareja que m\xE1s te gusta. Luego b\xE9sala.",duration:null,special:!1,specialType:null},{id:"LM-BS-07",deck:"limite",category:"Boca sucia",level:4,actor:"AMBOS",title:"Solo sonidos",instruction:"Prohibido hablar. Solo pueden comunicarse con gemidos, suspiros y respiraci\xF3n. Lo que guste, se nota en el volumen.",duration:"3 min",special:!1,specialType:null},{id:"LM-BS-08",deck:"limite",category:"Boca sucia",level:4,actor:"T\xDA",title:"Audio prohibido",instruction:"Graba un audio de 20 segundos diciendo lo que quieres que te haga. Tu pareja lo escucha con aud\xEDfonos mientras la acaricias.",duration:null,special:!1,specialType:null},{id:"LM-MO-01",deck:"limite",category:"Manda y obedece",level:4,actor:"T\xDA",title:"Orden",instruction:"Solo puedes obedecer. Tu pareja da las instrucciones; t\xFA no hablas, no preguntas y no te mueves sin permiso.",duration:"3 min",special:!1,specialType:null},{id:"LM-MO-02",deck:"limite",category:"Manda y obedece",level:4,actor:"T\xDA",title:"De rodillas",instruction:"Arrod\xEDllate frente a tu pareja. Te da 3 \xF3rdenes seguidas y las cumples sin decir una palabra.",duration:null,special:!1,specialType:null},{id:"LM-MO-03",deck:"limite",category:"Manda y obedece",level:4,actor:"T\xDA",title:"Manos en la pared",instruction:"Tu pareja apoya las palmas en la pared y no puede despegarlas. T\xFA la recorres desde atr\xE1s, a tu ritmo.",duration:"2 min",special:!1,specialType:null},{id:"LM-MO-04",deck:"limite",category:"Manda y obedece",level:4,actor:"T\xDA",title:"Inspecci\xF3n",instruction:"Tu pareja se queda de pie, inm\xF3vil. Rec\xF3rrela con las manos de pies a cabeza, como si fuera tuya.",duration:"2 min",special:!1,specialType:null},{id:"LM-MO-05",deck:"limite",category:"Manda y obedece",level:4,actor:"TU PAREJA",title:"Siempre s\xED",instruction:"Hasta la siguiente carta especial, tu pareja solo puede responder \u201Cs\xED\u201D a lo que le pidas. PASO sigue valiendo.",duration:null,special:!1,specialType:null},{id:"LM-MO-06",deck:"limite",category:"Manda y obedece",level:4,actor:"T\xDA",title:"Escultor",instruction:"Acomoda el cuerpo de tu pareja en la postura que quieras. Debe sostenerla mientras la besas a tu antojo.",duration:"1 min",special:!1,specialType:null},{id:"LM-MO-07",deck:"limite",category:"Manda y obedece",level:4,actor:"TU PAREJA",title:"Al ritmo de mi voz",instruction:"Tu pareja te acaricia y t\xFA solo diriges con palabras: m\xE1s lento, m\xE1s r\xE1pido, ah\xED, m\xE1s abajo. Tus manos no participan.",duration:"2 min",special:!1,specialType:null},{id:"LM-MO-08",deck:"limite",category:"Manda y obedece",level:4,actor:"AMBOS",title:"Cambio de mando",instruction:"Lancen una moneda. Quien gane manda las pr\xF3ximas 3 cartas: decide qui\xE9n las cumple y c\xF3mo.",duration:null,special:!1,specialType:null},{id:"LM-PR-01",deck:"limite",category:"Prohibido",level:5,actor:"T\xDA",title:"Manos atr\xE1s",instruction:"Manos detr\xE1s de la espalda. Tu pareja te besa y acaricia todo el cuerpo y t\xFA no puedes tocarla ni una sola vez.",duration:"2 min",special:!1,specialType:null},{id:"LM-PR-02",deck:"limite",category:"Prohibido",level:5,actor:"T\xDA",title:"Solo con la boca",instruction:"Qu\xEDtale una prenda a tu pareja usando solo la boca. Si usas las manos, empiezas con otra prenda.",duration:null,special:!1,specialType:null},{id:"LM-PR-03",deck:"limite",category:"Prohibido",level:5,actor:"TU PAREJA",title:"Prohibido moverse",instruction:"Te acuestas boca arriba. Tu pareja te recorre con la boca a su antojo; si te mueves, el reloj vuelve a cero.",duration:"2 min",special:!1,specialType:null},{id:"LM-PR-04",deck:"limite",category:"Prohibido",level:5,actor:"T\xDA",title:"Cuenta regresiva",instruction:"Tu pareja cuenta en voz alta de 30 a 0. Mientras cuenta, haz lo que quieras con tus manos; en cero, te detienes en seco.",duration:"30 s",special:!1,specialType:null},{id:"LM-PR-05",deck:"limite",category:"Prohibido",level:5,actor:"AMBOS",title:"Lugar prohibido",instruction:"Vayan a un rinc\xF3n de la casa donde nunca se han besado as\xED, y no paren hasta que alguien pida volver.",duration:null,special:!1,specialType:null},{id:"LM-PR-06",deck:"limite",category:"Prohibido",level:5,actor:"T\xDA",title:"Prenda de garant\xEDa",instruction:"Qu\xEDtate la ropa interior y entr\xE9gasela a tu pareja. La guarda hasta el final del juego.",duration:null,special:!1,specialType:null},{id:"LM-PR-07",deck:"limite",category:"Prohibido",level:5,actor:"T\xDA",title:"Sin labios",instruction:"Prohibido besar con los labios: solo con la lengua y la respiraci\xF3n, por el cuello, el pecho y el abdomen.",duration:"1 min",special:!1,specialType:null},{id:"LM-PR-08",deck:"limite",category:"Prohibido",level:5,actor:"TU PAREJA",title:"Prohibido pedir",instruction:"Tu pareja se acuesta y no puede pedir nada. T\xFA decides qu\xE9, d\xF3nde y cu\xE1nto. Ella solo puede decir PAUSA.",duration:"2 min",special:!1,specialType:null},{id:"LM-SP-01",deck:"limite",category:"Sin pudor",level:5,actor:"T\xDA",title:"Recompensa",instruction:"Elige una parte del cuerpo de tu pareja y ded\xEDcale un minuto entero con la boca. Ella decide si te ganaste otro minuto.",duration:"1 min",special:!1,specialType:null},{id:"LM-SP-02",deck:"limite",category:"Sin pudor",level:5,actor:"AMBOS",title:"Fuera todo",instruction:"Desde ahora, completamente desnudos. Sin cobijas, sin batas, sin excepciones.",duration:"Resto del juego",special:!1,specialType:null},{id:"LM-SP-03",deck:"limite",category:"Sin pudor",level:5,actor:"T\xDA",title:"La marca",instruction:"D\xE9jale a tu pareja una marca de beso en un lugar que solo ustedes dos van a ver.",duration:null,special:!1,specialType:null},{id:"LM-SP-04",deck:"limite",category:"Sin pudor",level:5,actor:"T\xDA",title:"Territorio nuevo",instruction:"Elige una parte del cuerpo de tu pareja que nunca hayas besado y qu\xE9date ah\xED.",duration:"1 min",special:!1,specialType:null},{id:"LM-SP-05",deck:"limite",category:"Sin pudor",level:5,actor:"TU PAREJA",title:"Show privado",instruction:"Pon una canci\xF3n. Tu pareja te hace un baile sobre tus piernas; t\xFA no puedes usar las manos, solo decirle lo que te provoca.",duration:"1 canci\xF3n",special:!1,specialType:null},{id:"LM-SP-06",deck:"limite",category:"Sin pudor",level:5,actor:"AMBOS",title:"Lejos de la cama",instruction:"La siguiente carta se cumple en otro cuarto: de pie, en el sill\xF3n o donde se les ocurra. La cama queda prohibida.",duration:null,special:!1,specialType:null},{id:"LM-SP-07",deck:"limite",category:"Sin pudor",level:5,actor:"T\xDA",title:"Mi mano, tu mano",instruction:"Toma la mano de tu pareja y ll\xE9vala t\xFA por tu cuerpo, a donde y como quieras. Ella no decide nada.",duration:"1 min",special:!1,specialType:null},{id:"LM-SP-08",deck:"limite",category:"Sin pudor",level:5,actor:"T\xDA",title:"La m\xE1s atrevida",instruction:"Pide lo m\xE1s atrevido que quieras esta noche. Tu pareja responde s\xED, no o \u201Cte lo cambio por\u2026\u201D.",duration:null,special:!1,specialType:null},{id:"LM-ESP-01",deck:"limite",category:null,level:null,actor:"AMBOS",title:"LOS DOS",instruction:"La siguiente carta la cumplen los dos, uno despu\xE9s del otro, y con el doble de tiempo.",duration:null,special:!0,specialType:"nota"},{id:"LM-ESP-02",deck:"limite",category:null,level:null,actor:"T\xDA",title:"ELIGE TU VENENO",instruction:"Roba 2 cartas. Tu pareja las lee en silencio y elige cu\xE1l vas a cumplir.",duration:null,special:!0,specialType:"nota"},{id:"LM-ESP-03",deck:"limite",category:null,level:null,actor:"AMBOS",title:"SIN FILTRO",instruction:"Hasta la siguiente especial, todo se pide en voz alta y con palabras directas. Nada de insinuar.",duration:null,special:!0,specialType:"nota"},{id:"LM-ESP-04",deck:"limite",category:null,level:null,actor:"AMBOS",title:"ESCALADA",instruction:"La siguiente carta se cumple con una prenda menos de las que ya llevan\u2026 y con la luz encendida.",duration:null,special:!0,specialType:"nota"}]};var dy={version:"1.0.0",bonuses:[{id:"sensacion",name:"SENSACI\xD3N-ES",tagline:"El ritual para preparar el ambiente.",text:"Gu\xEDa de los cinco sentidos, tres rituales y masaje paso a paso.",file:"/regalos/Sensacion-es.pdf"},{id:"reconexion",name:"RECONEXI\xD3N-ES",tagline:"Vuelvan a encontrarse.",text:"Microrituales, conversaciones y un reto de 30 d\xEDas.",file:"/regalos/Reconexion-es.pdf"},{id:"investigacion",name:"INVESTIGACI\xD3N-ES",tagline:"4 misterios para resolver en pareja.",text:"Cuatro casos con sospechosos, evidencias y soluciones selladas.",file:"/regalos/Investigacion-es.pdf"},{id:"plan",name:"PLAN-ES",tagline:"104 ideas para tener m\xE1s momentos de dos.",text:"El Reto 2\xD752 completo, con tracker y comodines.",file:"/regalos/Plan-es.pdf"}],printables:[{id:"confesion",name:"CONFESI\xD3N-ES \xB7 imprimible",file:"/regalos/Confesion-es_Imprimible_A4.pdf"},{id:"provocacion",name:"PROVOCACI\xD3N-ES \xB7 imprimible",file:"/regalos/Provocacion-es_Imprimible_A4.pdf"},{id:"decision",name:"DECISI\xD3N-ES \xB7 imprimible",file:"/regalos/Decision-es_Imprimible_A4.pdf"},{id:"limite",name:"AL L\xCDMITE-ES \xB7 imprimible (mazo oculto)",file:"/regalos/Al-Limite-es_Mazo_Oculto_A4.pdf"}],plans:[{week:1,a:{title:"Cena con lo que haya",text:"Velas, mantel y una cena improvisada con lo que encuentren en el refri. Prohibido pedir a domicilio.",category:"En casa"},b:{title:"Clase de cocina",text:"Inscr\xEDbanse a una clase (presencial o en l\xEDnea) de un platillo que ninguno sepa preparar.",category:"Citas diferentes"}},{week:2,a:{title:"Atardecer sin celulares",text:"Caminata a la hora del atardecer. Los tel\xE9fonos se quedan en casa.",category:"Bajo presupuesto"},b:{title:"Ciudad desde arriba",text:"Suban a un mirador, una azotea o un bar en altura para ver la ciudad de noche.",category:"Salgan de lo mismo"}},{week:3,a:{title:"Pel\xEDcula por sorteo",text:"Cada uno escribe tres pel\xEDculas en papelitos. Se saca una al azar y no se vale quejarse.",category:"En casa"},b:{title:"Autocinema",text:"Busquen un autocinema o una funci\xF3n al aire libre. Lleven cobija y botanas.",category:"Citas diferentes"}},{week:4,a:{title:"Desayuno en la cama",text:"Uno de los dos lleva el desayuno a la cama un domingo. Sorpresa total.",category:"Sorpresa"},b:{title:"Brunch nuevo",text:"Elijan un lugar de brunch donde nunca hayan ido y pidan algo que no pedir\xEDan.",category:"Salgan de lo mismo"}},{week:5,a:{title:"Picnic en la sala",text:"Mantel en el piso, cojines, comida para picar y m\xFAsica. Picnic sin salir de casa.",category:"En casa"},b:{title:"Picnic en un jard\xEDn",text:"Armen juntos una canasta y vayan a un jard\xEDn bot\xE1nico, un bosque o un parque grande.",category:"Bajo presupuesto"}},{week:6,a:{title:"Karaoke casero",text:"Cinco canciones cada uno, con micr\xF3fono improvisado. Se califica actitud, no afinaci\xF3n.",category:"Para re\xEDrse"},b:{title:"Bar de karaoke",text:"Una noche de karaoke de verdad, con una canci\xF3n a dueto obligatoria.",category:"Para re\xEDrse"}},{week:7,a:{title:"Tres mensajes",text:"Durante el d\xEDa, cada uno manda tres mensajes coquetos al otro. La noche hace el resto.",category:"Con chispa"},b:{title:"Hotel en su ciudad",text:"Una noche de hotel sin viajar. Cambiar de cama cambia la noche.",category:"Con chispa"}},{week:8,a:{title:"Mercado de sabores",text:"Recorran un mercado y compren tres cosas que nunca hayan probado. Pru\xE9benlas en casa.",category:"Bajo presupuesto"},b:{title:"Ruta de antojitos",text:"Un recorrido por tres puestos o lugares de comida de la ciudad en una sola noche.",category:"Citas diferentes"}},{week:9,a:{title:"Rompecabezas",text:"Uno de 500 piezas, m\xFAsica de fondo y una bebida. Termina cuando se acabe o cuando se distraigan.",category:"En casa"},b:{title:"Escape room",text:"Una hora para escapar juntos. Descubrir\xE1n c\xF3mo trabajan en equipo bajo presi\xF3n.",category:"Citas diferentes"}},{week:10,a:{title:"Fotos de antes",text:"Revisen fotos viejas y elijan diez para imprimir y poner en alg\xFAn lugar de la casa.",category:"Conexi\xF3n"},b:{title:"Sesi\xF3n de fotos",text:"Con el temporizador del celular, una sesi\xF3n de fotos de pareja en un lugar bonito.",category:"Conexi\xF3n"}},{week:11,a:{title:"Caf\xE9 de 30 minutos",text:"Una cita express: caf\xE9 en la esquina, sin hablar de pendientes.",category:"Express"},b:{title:"Clase de baile",text:"Una clase de salsa, bachata, tango o lo que les d\xE9 curiosidad.",category:"Citas diferentes"}},{week:12,a:{title:"Sabor de infancia",text:"Cocinen juntos el platillo favorito de la infancia de uno de los dos.",category:"Conexi\xF3n"},b:{title:"Mi barrio",text:"Visiten el barrio o la ciudad donde creci\xF3 uno de ustedes. El otro es el turista.",category:"Conexi\xF3n"}},{week:13,a:{title:"Noche sin pantallas",text:"Velas, pl\xE1tica y nada de pantallas desde la cena hasta dormir.",category:"Conexi\xF3n"},b:{title:"Cielo estrellado",text:"Salgan de la ciudad lo suficiente para ver estrellas. Una cobija en el cofre del auto basta.",category:"Salgan de lo mismo"}},{week:14,a:{title:"Duelo de cocina",text:"Mismo ingrediente, dos platillos distintos. El jurado es el otro.",category:"Para re\xEDrse"},b:{title:"Cata",text:"Cata de vinos, cervezas artesanales o mezcales, en un lugar especializado o en casa.",category:"Citas diferentes"}},{week:15,a:{title:"Ba\xF1o con sales",text:"Tina o regadera con sales, velas y m\xFAsica. Usen el ritual Express de SENSACI\xD3N-ES.",category:"Con chispa"},b:{title:"Spa para dos",text:"Masaje en pareja o un d\xEDa de spa. Ag\xE9ndenlo con tiempo.",category:"Con chispa"}},{week:16,a:{title:"Sorpresa con hora",text:"Uno organiza todo; el otro solo sabe a qu\xE9 hora debe estar listo.",category:"Sorpresa"},b:{title:"Destino secreto",text:"Uno elige el lugar y solo dice c\xF3mo vestirse. El destino se revela al llegar.",category:"Sorpresa"}},{week:17,a:{title:"Lectura en voz alta",text:"Elijan un libro corto y lean un cap\xEDtulo cada uno, en voz alta, en la cama.",category:"En casa"},b:{title:"Libro para ti",text:"En una librer\xEDa, cada uno elige un libro para el otro. Despu\xE9s, caf\xE9 para explicar por qu\xE9.",category:"Salgan de lo mismo"}},{week:18,a:{title:"Sobre ruedas",text:"Bicicleta, patines o patineta por un parque o ciclov\xEDa.",category:"Bajo presupuesto"},b:{title:"Agua",text:"Renten un kayak, una lancha de pedales o una trajinera por una tarde.",category:"Salgan de lo mismo"}},{week:19,a:{title:"Gira y sigue",text:"Salgan sin plan. En cada esquina, uno decide hacia d\xF3nde girar. Paren donde algo les llame.",category:"Improvisados"},b:{title:"Pueblo de un d\xEDa",text:"Elijan un pueblo a menos de dos horas y vayan sin itinerario.",category:"Improvisados"}},{week:20,a:{title:"Noche de otro pa\xEDs",text:"Comida, bebida y m\xFAsica de un pa\xEDs que quieran conocer. Todo en casa.",category:"En casa"},b:{title:"Cocina desconocida",text:"Restaurante de una cocina que nunca hayan probado: et\xEDope, coreana, peruana, libanesa\u2026",category:"Salgan de lo mismo"}},{week:21,a:{title:"Carta a mano",text:"Cada uno escribe una carta al otro y la lee en voz alta.",category:"Conexi\xF3n"},b:{title:"C\xE1psula del tiempo",text:"Guarden cartas, fotos y una lista de deseos en una caja para abrir en cinco a\xF1os.",category:"Conexi\xF3n"}},{week:22,a:{title:"Retrato en 5 minutos",text:"Dib\xFAjense mutuamente en cinco minutos. Las obras se firman y se guardan.",category:"Para re\xEDrse"},b:{title:"Taller creativo",text:"Taller de cer\xE1mica, pintura o vitral. Lo que hagan se queda en casa.",category:"Citas diferentes"}},{week:23,a:{title:"Masaje por turnos",text:"Veinte minutos de masaje para cada uno, con los 7 pasos de SENSACI\xD3N-ES.",category:"Con chispa"},b:{title:"Noche tem\xE1tica",text:"Elijan un tema (los 80, casino, playa) y v\xEDstanse para la ocasi\xF3n, aunque sea en casa.",category:"Con chispa"}},{week:24,a:{title:"Helado y paseo",text:"Helado en un lugar nuevo y una caminata sin rumbo.",category:"Express"},b:{title:"Feria",text:"Juegos mec\xE1nicos, algod\xF3n de az\xFAcar y ganar un peluche (o intentarlo).",category:"Para re\xEDrse"}},{week:25,a:{title:"Pizza desde la masa",text:"Hagan la masa, elijan ingredientes y armen una pizza cada uno.",category:"En casa"},b:{title:"Mixolog\xEDa",text:"Clase de cocteles o preparen tres cocteles nuevos en casa con receta.",category:"Citas diferentes"}},{week:26,a:{title:"Medio a\xF1o",text:"Revisen los planes que llevan: \xBFcu\xE1l fue el mejor y cu\xE1l no repetir\xEDan?",category:"Conexi\xF3n"},b:{title:"Cena de gala",text:"Restaurante elegante con c\xF3digo de vestimenta. V\xEDstanse como para una boda.",category:"Salgan de lo mismo"}},{week:27,a:{title:"Serie nueva",text:"Elijan una serie que ninguno haya visto y vean tres cap\xEDtulos seguidos.",category:"En casa"},b:{title:"En vivo",text:"Concierto, obra de teatro, show o festival.",category:"Citas diferentes"}},{week:28,a:{title:"Algo que crezca",text:"Planten juntos hierbas de cocina o una suculenta. Cu\xEDdenla todo el a\xF1o.",category:"Bajo presupuesto"},b:{title:"Rinc\xF3n verde",text:"Visiten un vivero y armen juntos un rinc\xF3n con plantas en casa.",category:"Salgan de lo mismo"}},{week:29,a:{title:"Nota de voz",text:"Un mensaje de voz de un minuto con todo lo que admiras de tu pareja.",category:"Sorpresa"},b:{title:"Primera cita, otra vez",text:"Recreen su primera cita: mismo lugar o lo m\xE1s parecido posible.",category:"Conexi\xF3n"}},{week:30,a:{title:"Juego de mesa a muerte",text:"Cartas, domin\xF3, loter\xEDa o el juego que tengan. Quien pierda prepara el caf\xE9 ma\xF1ana.",category:"Para re\xEDrse"},b:{title:"Boliche o billar",text:"Una noche de boliche o billar. Apuesta: quien pierda elige el siguiente plan.",category:"Para re\xEDrse"}},{week:31,a:{title:"Domingo desconectado",text:"Una ma\xF1ana completa de domingo sin celulares.",category:"Conexi\xF3n"},b:{title:"Amanecer",text:"Despierten temprano para ver salir el sol desde un lugar alto.",category:"Salgan de lo mismo"}},{week:32,a:{title:"Postre a cuatro manos",text:"Preparen juntos un postre que nunca hayan hecho.",category:"En casa"},b:{title:"Taller de chocolate",text:"Taller de chocolate, reposter\xEDa o panader\xEDa.",category:"Citas diferentes"}},{week:33,a:{title:"Ropa cambiada",text:"V\xEDstanse con ropa del otro y salgan por un caf\xE9.",category:"Para re\xEDrse"},b:{title:"Turistas en casa",text:"Un d\xEDa como turistas en su ciudad: museo, tour y comida t\xEDpica.",category:"Salgan de lo mismo"}},{week:34,a:{title:"Estreno de pijama",text:"Uno sorprende al otro con pijama o lencer\xEDa nueva.",category:"Con chispa"},b:{title:"Caba\xF1a o glamping",text:"Una noche fuera, en una caba\xF1a o glamping, sin se\xF1al si se puede.",category:"Con chispa"}},{week:35,a:{title:"Lista de 5 a\xF1os",text:"Escriban juntos 20 cosas que quieren hacer en los pr\xF3ximos cinco a\xF1os.",category:"Conexi\xF3n"},b:{title:"El gran viaje",text:"Planeen su pr\xF3ximo viaje grande, con fechas y presupuesto.",category:"Conexi\xF3n"}},{week:36,a:{title:"Parada al azar",text:"Tomen el transporte p\xFAblico y bajen en una parada elegida al azar.",category:"Improvisados"},b:{ti , preg\xFAntense: \xAB\xBFSubimos?\xBB. Si ambos aceptan, pueden pasar a ACCI\xD3N-ES; si no, seguir con CONEXI\xD3N-ES o terminar."},{title:"ACCI\xD3N-ES: progresi\xF3n",text:"Comiencen en Nivel 1 \u2014 AC\xC9RCATE. Mantengan los cinco niveles separados; no mezclen cartas entre niveles. En cada nivel, barajen sus 12 cartas normales y jueguen cuatro de ellas, seguidas de una carta especial de ACCI\xD3N-ES. Al terminar, cada persona decide si quiere subir de nivel. Solo avanzan si ambas responden que s\xED; de otro modo permanecen, bajan o terminan. Los niveles siguientes son ATR\xC9VETE, SIN PENA, SUBE LA INTENSIDAD y AL ROJO VIVO."},{title:"Modos de partida",text:"EXPRESS: 6 cartas normales de CONEXI\xD3N-ES y entre 4 y 8 de ACCI\xD3N-ES, siempre respetando el nivel elegido de com\xFAn acuerdo. CL\xC1SICA: 10 cartas normales de CONEXI\xD3N-ES + 2 especiales; despu\xE9s, en ACCI\xD3N-ES, 4 normales + 1 especial por nivel alcanzado. COMPLETA: contin\xFAen tanto como ambos quieran, sin meta obligatoria. MODO LIBRE: despu\xE9s de conocer el juego en una primera partida, pueden escoger fases y niveles de com\xFAn acuerdo; no elimina PASO, CAMBIO ni PAUSA."},{title:"Cartas especiales y ritmo",text:"Las cartas especiales no sustituyen autom\xE1ticamente una normal: son intervenciones adicionales al completar el bloque correspondiente. Deben identificarse claramente y mantenerse aparte para no aparecer por accidente. No se repite una especial en la misma partida salvo acuerdo de ambos. Si una especial no resulta apropiada, se aplica PASO o CAMBIO."},{title:"Final de partida",text:"Cualquiera puede decir \xABHASTA AQU\xCD\xBB en cualquier momento. La partida termina sin penalizaci\xF3n. No hay que completar 138 cartas, alcanzar un nivel concreto ni realizar una pr\xE1ctica para considerar que jugaron correctamente."},{title:"Cuidado y privacidad",text:"Todas las actividades requieren consentimiento continuo, informado y reversible. No se presiona para aceptar retos ni se i
